<!doctype html>
<html lang="ro">
  <head>

    <meta name="theme-color" content="#F6F3EC" />
    <meta name="description" content="De la țărm la skipper: cursuri de navigație, practică pe mare și experiențe la bord. Concept demonstrativ." />

         When the demo is hosted, replace /og-image.jpg with the absolute URL, e.g. https://demo.example.com/og-image.jpg -->

    <!-- Initial loader: inline so it paints before any JavaScript bundle arrives. -->
    <style>
      html.is-loading { overflow: hidden; }
      #loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f6f3ec; color: #0b2545; transition: opacity .7s ease, visibility .7s; --p: 0; --main: 0; --jib: 0; }
      #loader.is-done { opacity: 0; visibility: hidden; }
      #loader .ld { display: grid; justify-items: center; gap: 22px; width: min(280px, 80vw); }
      /* 3D stage: hull drawn in three-quarter view, sails are real 3D planes that swing open */
      #loader .stage { position: relative; width: 260px; height: 230px; perspective: 700px; perspective-origin: 50% 30%; }
      #loader .boat { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 82%; animation: ld-rock 3.4s ease-in-out infinite; }
      #loader .hull { position: absolute; left: 34px; top: 146px; width: 192px; height: 56px; overflow: visible; }
      #loader .mast { position: absolute; left: 127px; top: 16px; width: 3px; height: 140px; border-radius: 2px; background: linear-gradient(90deg, #0b2545, #1f5faf); }
      #loader .main { position: absolute; left: 56px; top: 22px; width: 72px; height: 134px; transform-origin: 100% 50%; transform-style: preserve-3d;
        transform: rotateY(calc(-20deg - (1 - var(--main)) * 68deg)); }
      #loader .main svg, #loader .jib svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #loader .boom { position: absolute; left: 0; right: 0; bottom: 6px; height: 3px; border-radius: 2px; background: #0b2545; }
      #loader .jib { position: absolute; left: 130px; top: 26px; width: 62px; height: 124px; transform-origin: 0 50%;
        transform: rotateY(calc(16deg + (1 - var(--jib)) * 72deg)); }
      #loader .flag { position: absolute; left: 130px; top: 12px; width: 16px; height: 9px; background: #c8643b; clip-path: polygon(0 0, 100% 50%, 0 100%); transform-origin: 0 50%; transform: scaleX(var(--jib)); }
      #loader .sailpath { stroke: #0b2545; stroke-width: 1.3; stroke-linejoin: round; }
      #loader .seam { fill: none; stroke: #1f5faf; stroke-width: .7; opacity: .4; }
      /* water: a perspective plane with ripples and the boat's shadow */
      #loader .water { position: absolute; left: 50%; top: 186px; width: 300px; height: 300px; margin: -150px 0 0 -150px; transform: rotateX(76deg); pointer-events: none; }
      #loader .water::before { content: ''; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(closest-side, rgba(11, 37, 69, .22), rgba(11, 37, 69, 0)); }
      #loader .water i { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; margin: -50% 0 0 -50%; border-radius: 50%; border: 2px solid rgba(42, 125, 225, .55); opacity: 0; animation: ld-ripple 3.6s ease-out infinite; }
      #loader .water i:nth-child(2) { animation-delay: 1.2s; }
      #loader .water i:nth-child(3) { animation-delay: 2.4s; }
      @keyframes ld-rock { 0%, 100% { transform: rotateZ(-1.8deg) translateY(0); } 50% { transform: rotateZ(1.8deg) translateY(-3px); } }
      @keyframes ld-ripple { 0% { transform: scale(.28); opacity: .8; } 100% { transform: scale(1); opacity: 0; } }
      #loader .cap { margin: 0; font: 500 11px/1.4 'IBM Plex Mono', ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; color: #3d6797; min-height: 1.4em; }
      #loader .bar { position: relative; width: 100%; height: 2px; background: rgba(11, 37, 69, .1); border-radius: 2px; overflow: hidden; }
      #loader .bar i { position: absolute; inset: 0; background: #1f5faf; transform-origin: 0 50%; transform: scaleX(var(--p)); }
      #loader .pct { margin: 0; font: 500 12px/1 'IBM Plex Mono', ui-monospace, Menlo, monospace; letter-spacing: .1em; color: #b5532f; font-variant-numeric: tabular-nums; }
      @keyframes ld-rock { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
      @media (prefers-reduced-motion: reduce) { #loader .boat, #loader .water i { animation: none; } #loader .water i { opacity: .35; transform: scale(.6); } #loader { transition: none; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite" aria-label="Se încarcă harta">
      <div class="ld">
        <div class="stage" aria-hidden="true">
          <div class="water"><i></i><i></i><i></i></div>
          <div class="boat">
            <div class="main">
              <svg viewBox="0 0 72 134" focusable="false">
                <defs>
                  <linearGradient id="ldMain" x1="1" x2="0" y1="0" y2="0">
                    <stop offset="0" stop-color="#ffffff" />
                    <stop offset=".55" stop-color="#f4f7fc" />
                    <stop offset="1" stop-color="#c9daf0" />
                  </linearGradient>
                </defs>
                <path class="sailpath" fill="url(#ldMain)" d="M71 0 C58 40 34 88 3 126 L71 126 Z" />
                <path class="seam" d="M71 34 L48 60 M71 62 L34 86 M71 90 L20 108" />
              </svg>
              <div class="boom"></div>
            </div>
            <div class="mast"></div>
            <div class="jib">
              <svg viewBox="0 0 62 124" focusable="false">
                <defs>
                  <linearGradient id="ldJib" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0" stop-color="#ffffff" />
                    <stop offset=".6" stop-color="#eef3fa" />
                    <stop offset="1" stop-color="#c3d5ee" />
                  </linearGradient>
                </defs>
                <path class="sailpath" fill="url(#ldJib)" d="M1 0 C9 40 30 86 60 122 L2 122 C5 80 4 40 1 0 Z" />
                <path class="seam" d="M3 48 L24 70 M3 84 L42 102" />
              </svg>
            </div>
            <div class="flag"></div>
            <svg class="hull" viewBox="0 0 192 56" focusable="false">
              <defs>
                <linearGradient id="ldSide" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0" stop-color="#ffffff" />
                  <stop offset="1" stop-color="#d4e1f2" />
                </linearGradient>
                <linearGradient id="ldDeck" x1="0" x2="1" y1="0" y2="0">
                  <stop offset="0" stop-color="#efe7d6" />
                  <stop offset="1" stop-color="#f8f3e8" />
                </linearGradient>
              </defs>
              <!-- topsides (the side of the hull facing us) -->
              <path fill="url(#ldSide)" stroke="#0b2545" stroke-width="1.5" stroke-linejoin="round" d="M6 16 C50 26 136 26 186 12 C178 32 154 48 120 52 L58 52 C32 49 14 36 6 16 Z" />
              <!-- deck, seen from slightly above -->
              <path fill="url(#ldDeck)" stroke="#0b2545" stroke-width="1.5" stroke-linejoin="round" d="M6 16 C40 4 130 0 186 12 C136 26 50 26 6 16 Z" />
              <!-- cabin -->
              <path fill="#ffffff" stroke="#0b2545" stroke-width="1.2" stroke-linejoin="round" d="M70 14 L74 6 L114 4 L118 12 C104 15 84 16 70 14 Z" />
              <path fill="#1f5faf" d="M80 9 L86 8 L86 11 L80 11.5 Z M92 7.5 L104 7 L104 10.5 L92 11 Z" />
              <!-- boot stripe + waterline -->
              <path fill="none" stroke="#1f5faf" stroke-width="2.4" stroke-linecap="round" d="M14 30 C56 38 140 37 176 26" />
              <path fill="none" stroke="#0b2545" stroke-width="1" opacity=".35" d="M30 44 C70 50 130 49 160 40" />
            </svg>
          </div>
        </div>
        <p class="cap" data-cap>Ridicăm ancora</p>
        <div class="bar"><i></i></div>
        <p class="pct" data-pct>0%</p>
      </div>
    </div>
    <script>
      /* Real progress: each milestone reports in once; the sails follow the progress. */
      ;(function () {
        var el = document.getElementById('loader')
        if (!el) return
        document.documentElement.classList.add('is-loading')
        var W = { app: 20, fonts: 10, scene: 35, frame: 15, chart: 15 }
        var CAP = [[0, 'Ridicăm ancora'], [25, 'Pregătim velele'], [55, 'Desenăm harta'], [80, 'Trasăm ruta'], [100, 'Pornim']]
        var done = {}, goal = 5, shown = 0, finished = false, raf = 0
        var cap = el.querySelector('[data-cap]'), pct = el.querySelector('[data-pct]')
        var clamp = function (v) { return Math.max(0, Math.min(1, v)) }
        function paint() {
          shown += (goal - shown) * 0.12
          if (goal - shown < 0.2) shown = goal
          var p = shown / 100
          el.style.setProperty('--p', p.toFixed(4))
          el.style.setProperty('--main', clamp(p / 0.6).toFixed(4))
          el.style.setProperty('--jib', clamp((p - 0.4) / 0.6).toFixed(4))
          pct.textContent = Math.round(shown) + '%'
          for (var i = CAP.length - 1; i >= 0; i--) if (shown >= CAP[i][0]) { if (cap.textContent !== CAP[i][1]) cap.textContent = CAP[i][1]; break }
          if (shown >= 100 && !finished) { finished = true; setTimeout(hide, 350) }
          if (!finished || shown < 100) raf = requestAnimationFrame(paint)
        }
        function hide() {
          el.classList.add('is-done')
          el.setAttribute('aria-label', 'Harta s-a încărcat')
          document.documentElement.classList.remove('is-loading')
          setTimeout(function () { el.remove() }, 800)
        }
        window.__loader = {
          step: function (name) {
            if (done[name] || !(name in W)) return
            done[name] = true
            goal = 5
            for (var k in done) goal += W[k]
            goal = Math.min(100, goal)
          },
          finish: function () { goal = 100 },
        }
        raf = requestAnimationFrame(paint)
        // never trap the visitor behind the loader
        setTimeout(function () { goal = 100 }, 12000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
